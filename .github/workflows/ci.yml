name: JobPilot CI - Test & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Backend Automated Tests & Migrations Check
  # ─────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Python 3.12 + Postgres + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/jobtracker_test
          SECRET_KEY: test_secret_key_ci_environment_1234567890
          ALGORITHM: HS256
          PYTHONPATH: .
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run backend unit test suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/jobtracker_test
          SECRET_KEY: test_secret_key_ci_environment_1234567890
          ALGORITHM: HS256
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          PYTHONPATH: .
        run: |
          cd backend
          python -m pytest tests/unit

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend Compilation & TypeScript Check
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Node.js 20 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile TypeScript & build Vite bundle
        run: |
          cd frontend
          npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Docker Images Build Verification
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Multi-Stage Image Builds
    runs-on: ubuntu-latest
    needs: [ backend-tests, frontend-build ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: jobpilot-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: jobpilot-frontend:ci-test

